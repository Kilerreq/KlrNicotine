# =====================================================
#  SNUS CONFIGURATION (snus.yml)
#  - snus_types: logical types (display name, nicotine mg, effects/stages)
#  - snus_packs: physical packs you give to players (size, item, name) and which type they spawn
# =====================================================

snus_types:
  GENERAL:
    display_name: "&b&lGeneral &f&l| &fNicotine Pouches"
    nicotine_mg: 20
    taken_item:
      material: SUGAR
      custom_model_data: 2199
    overdose:
      trigger_stage: 3        # 1 = pierwszy etap, 2 = drugi, 3 = trzeci, itd.
      vomiting: false         # czy uruchomić animację wymiotów (globalna konfiguracja particle/sounds)
      effects:                # dodatkowe efekty na tym etapie
        - "NAUSEA:2:45"
        - "BLINDNESS:1:20"
    stages:
      - effects:
          - "SPEED:2:10"
          - "JUMP:1:10"
          - "BLINDNESS:2:10"
        delay_after: 15
        extra_after:
          - "CONFUSION:1:10"
      - effects:
          - "SPEED:3:10"
        delay_after: 10
        extra_after:
          - "CONFUSION:1:10"
      - effects:
          - "SPEED:4:10"
          - "STRENGTH:2:10"
        delay_after: 15
        extra_after:
