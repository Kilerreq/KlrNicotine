# ===============================
#  Language: English (EN)
#  Mirrors the Polish file keys
#  Use color codes with & (e.g. &7, &b, &l, &o)
# ===============================

prefix: "&8[&bNicotine&8] &7"

# ---- Help ----
help_header: "&b---- &lNicotine&b Help ----"
help_list: |
  &7/np help &8-&7 Show this help
  &7/np version &8-&7 Show plugin version
  &7/np reload &8-&7 Reload configs and languages
  &7/np give cigarette <id> &8-&7 Give a cigarette pack
  &7/np give snus <id> &8-&7 Give a snus pack
  &7/wypluj &8-&7 Spit the snus out
help_footer: "&7-------------------------------"

# ---- Generic ----
